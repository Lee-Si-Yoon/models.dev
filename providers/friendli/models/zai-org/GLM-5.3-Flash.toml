base_model = "zhipuai/glm-5.3-flash"

# Friendli serves text-only input for this model:
# https://api.friendli.ai/serverless/v1/models (accessed 2026-08-27)

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[interleaved]
field = "reasoning_content"

[modalities]
input = ["text"]
output = ["text"]

[cost]
input = 0.15
output = 0.5
cache_read = 0.03
